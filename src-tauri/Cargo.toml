[package]
name = "dynamic-island"
version = "0.1.0"
description = "A floating Linux Dynamic Island built with Tauri 2 and Svelte 5"
authors = ["dynamic-island"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
mpris = "2.1.0"
tauri-plugin-drag = "2.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }
cairo-rs = { version = "0.18" }


